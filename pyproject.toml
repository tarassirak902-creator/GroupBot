[project]
name = "groupbot"
version = "0.1.0"
description = "Telegram group bot based on MASTER-TZ v1.0"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.13,<4",
  "SQLAlchemy>=2.0,<3",
  "asyncpg>=0.29,<1",
  "pydantic-settings>=2.5,<3",
  "alembic>=1.13,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
