[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "groupbot"
version = "0.2.0"
description = "Telegram group management platform based on the current MASTER specification"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.13,<4",
  "SQLAlchemy>=2.0,<3",
  "asyncpg>=0.29,<1",
  "pydantic-settings>=2.5,<3",
  "alembic>=1.13,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
