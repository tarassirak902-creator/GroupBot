name: CI

on:
  push:
    branches:
      - main
      - bootstrap/v0.1
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: groupbot_ci
          POSTGRES_USER: groupbot
          POSTGRES_PASSWORD: groupbot_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U groupbot -d groupbot_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BOT_TOKEN: "123456:CI_TEST_TOKEN"
      DATABASE_URL: postgresql+asyncpg://groupbot:groupbot_ci_password@127.0.0.1:5432/groupbot_ci
      LOG_LEVEL: INFO

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q app tests alembic

      - name: Run unit tests
        run: pytest -q

      - name: Apply all database migrations
        run: alembic upgrade head

      - name: Verify Alembic head
        run: alembic current

      - name: Build Docker image
        run: docker build -t groupbot-ci .
